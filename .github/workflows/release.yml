name: Build & Release APK

# Aktivira se kad pushaš tag oblika v1.0, v1.1, itd.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore from GitHub Secret
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > rearscreenfix.jks

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/RearScreenFix-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RearScreenFix ${{ github.ref_name }}"
          body: |
            ## RearScreenFix ${{ github.ref_name }}

            LSPosed module that fixes rear screen theme application on Xiaomi popsicle (EliteGaming HyperOS 3.0).

            ### Installation
            1. Download `RearScreenFix-${{ github.ref_name }}.apk` below
            2. Install via LSPosed Manager
            3. Enable module → scope: ThemeManager
            4. Reboot

            See [README](https://github.com/${{ github.repository }}#readme) for full details.
          files: app/build/outputs/apk/release/RearScreenFix-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
